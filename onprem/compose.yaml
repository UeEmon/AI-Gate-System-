services:
  gate:
    build: ..
    image: ai-gate-system:onprem
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "${GATE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?Set an admin password}
      GATE_OFFLINE: ${GATE_OFFLINE:-0}
      GATE_OCR_BACKEND: lipla
      GATE_PLATE_PIPELINE: ${GATE_PLATE_PIPELINE:-lipla}
      GATE_PADDLE_PLATE_WEIGHTS: ${GATE_PADDLE_PLATE_WEIGHTS:-/models/plate.pt}
      GATE_PADDLE_REC_MODEL_DIR: ${GATE_PADDLE_REC_MODEL_DIR:-/models/paddle-rec}
      GATE_PADDLE_AUTO_TRAIN: ${GATE_PADDLE_AUTO_TRAIN:-0}
      GATE_PADDLE_TRAIN_REPO: ${GATE_PADDLE_TRAIN_REPO:-/training/PaddleOCR}
      GATE_PADDLE_PRETRAINED: ${GATE_PADDLE_PRETRAINED:-/models/PP-OCRv5_mobile_rec_pretrained.pdparams}
      GATE_MODEL_INIT_TIMEOUT: ${GATE_MODEL_INIT_TIMEOUT:-900}
      GATE_MODEL_ROOT: /models
      GATE_EMAIL_BACKEND: smtp
      GATE_EMAIL_FROM: ${GATE_EMAIL_FROM:-}
      GATE_EMAIL_TO: ${GATE_EMAIL_TO:-}
      GATE_SMTP_HOST: ${GATE_SMTP_HOST:-}
      GATE_SMTP_PORT: ${GATE_SMTP_PORT:-587}
      GATE_SMTP_TLS: ${GATE_SMTP_TLS:-starttls}
      GATE_SMTP_USER: ${GATE_SMTP_USER:-}
      GATE_SMTP_PASSWORD: ${GATE_SMTP_PASSWORD:-}
      GATE_PUBLIC_URL: ${GATE_PUBLIC_URL:-http://localhost:8080}
      GATE_S3_BUCKET: ""
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - gate-data:/data
      - gate-models:/models
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  gate-data:
  gate-models:
