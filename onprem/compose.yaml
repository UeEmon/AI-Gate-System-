services:
  gate:
    build: ..
    depends_on:
      - rtmp-ingest
    image: ai-gate-system:onprem
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "${GATE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?Set an admin password}
      GATE_OFFLINE: ${GATE_OFFLINE:-0}
      GATE_OCR_BACKEND: lipla
      GATE_MODEL_INIT_TIMEOUT: ${GATE_MODEL_INIT_TIMEOUT:-900}
      GATE_MODEL_ROOT: /models
      GATE_RTMP_LOCAL_URL: rtmp://rtmp-ingest:1935/gate-${GATE_RTMP_STREAM_KEY:?Run python3 onprem/setup_stream_receiver.py first}
      GATE_EMAIL_BACKEND: smtp
      GATE_EMAIL_FROM: ${GATE_EMAIL_FROM:-}
      GATE_EMAIL_TO: ${GATE_EMAIL_TO:-}
      GATE_SMTP_HOST: ${GATE_SMTP_HOST:-}
      GATE_SMTP_PORT: ${GATE_SMTP_PORT:-587}
      GATE_SMTP_TLS: ${GATE_SMTP_TLS:-starttls}
      GATE_SMTP_USER: ${GATE_SMTP_USER:-}
      GATE_SMTP_PASSWORD: ${GATE_SMTP_PASSWORD:-}
      GATE_PUBLIC_URL: ${GATE_PUBLIC_URL:-http://localhost:8080}
      GATE_S3_BUCKET: ""
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - gate-data:/data
      - gate-models:/models
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  trainer:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: Dockerfile.paddle
    image: ai-gate-system:paddle-trainer
    restart: unless-stopped
    init: true
    environment:
      GATE_MODEL_ROOT: /models
      GATE_PADDLE_AUTO_TRAIN: '1'
      GATE_PADDLE_TRAIN_REPO: /training/PaddleOCR
      GATE_PADDLE_PRETRAINED: /models/PP-OCRv5_mobile_rec_pretrained.pdparams
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
    volumes:
      - gate-data:/data
      - gate-models:/models
      - ../PaddleOCR:/training/PaddleOCR:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  rtmp-ingest:
    image: bluenviron/mediamtx:1.21.1
    restart: unless-stopped
    ports:
      - "${GATE_RTMP_BIND_ADDRESS:-0.0.0.0}:${GATE_RTMP_PORT:-1935}:1935"
      - "${GATE_RTMPS_BIND_ADDRESS:-0.0.0.0}:${GATE_RTMPS_PORT:-1936}:1936"
    volumes:
      - ./mediamtx.production.yml:/mediamtx.yml:ro
      - ./rtmp-certs:/rtmp-certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  gate-data:
  gate-models:
