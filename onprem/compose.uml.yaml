name: ai-gate-uml

services:
  uml:
    build:
      context: ../uml
      dockerfile: Dockerfile
    image: ai-gate-uml:local
    container_name: ai-gate-uml
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATE_UML_PORT:-8890}:8080"
    environment:
      PYLINTHOME: /tmp/pylint
    volumes:
      - ../docs:/diagrams:ro
      - ../aigate:/source/aigate:ro
      - ../app.py:/source/app.py:ro
      - ../web.py:/source/web.py:ro
      - ../model_service.py:/source/model_service.py:ro
      - ../lipla_pipeline.py:/source/lipla_pipeline.py:ro
      - ../plate_pipeline.py:/source/plate_pipeline.py:ro
      - ../ocr_backends.py:/source/ocr_backends.py:ro
      - ../ocr_learning.py:/source/ocr_learning.py:ro
      - ../paddle_auto_train.py:/source/paddle_auto_train.py:ro
      - ../paddle_training.py:/source/paddle_training.py:ro
      - ../events.py:/source/events.py:ro
      - ../evidence.py:/source/evidence.py:ro
      - ../vehicle_identity.py:/source/vehicle_identity.py:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
